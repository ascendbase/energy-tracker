<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Habit Tracker</title>
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(255, 255, 255, 0.8);
    --text: #1a1a1a;
    --muted: #8a8a8e;
    --accent: #000000;
    --radius: 22px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --panel-bg: rgba(255, 255, 255, 0.75);
    --panel-border: rgba(0, 0, 0, 0.05);
    --danger: #ff3b30;
    --success: #34c759;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  html, body {
    height: 100%; width: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; touch-action: pan-y;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #ffffff 0%, #e8e8ec 100%);
    
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; height: calc(100% - 48px); max-height: 780px; background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%); -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 32px 28px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--muted); margin-bottom: 22px; font-weight: 500; }
  .tabs { display: flex; gap: 6px; background: rgba(0,0,0,0.04); border-radius: 14px; padding: 4px; margin-bottom: 22px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 0; font-size: 14px; font-weight: 600;
    color: var(--muted); border-radius: 11px; cursor: pointer;
    transition: background 0.2s, color 0.2s; user-select: none;
  }
  .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .panel { display: none; overflow: hidden; flex: 1; min-height: 0; flex-direction: column; }
  .panel.active { display: flex; }
  .section-title { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

  /* Tracker habits */
  .habit-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; background: var(--panel-bg);
    border: 1px solid var(--panel-border); border-radius: 14px; margin-bottom: 10px; height: 56px; flex-shrink: 0; overflow: hidden;
  }
  .habit-name { flex: 1; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .habit-name input { width: 100%; padding: 6px 10px; font-size: 16px; border-radius: 10px; background: rgba(255,255,255,0.9); border: 1px solid var(--accent); font-weight: 600; font-family: inherit; color: var(--text); outline: none; }
  .habit-value {
    width: 70px; padding: 6px 8px; font-size: 16px; font-weight: 600; text-align: center;
    background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.08); border-radius: 10px;
    outline: none; font-family: inherit; color: var(--text); flex-shrink: 0;
  }
  .habit-value:focus { border-color: rgba(0,0,0,0.35); }
  .icon-btn {
    width: 34px; height: 34px; flex: 0 0 34px; display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 10px; background: rgba(0,0,0,0.05); color: var(--muted);
    cursor: pointer; font-size: 13px; transition: background 0.15s, color 0.15s; font-family: inherit;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.1); color: var(--text); }
  .icon-btn.danger:hover { background: rgba(255,59,48,0.12); color: var(--danger); }
  .add-row { display: flex; gap: 8px; margin-top: 14px; }
  .add-row input {
    flex: 1; min-width: 0; padding: 12px 14px; font-size: 15px; font-weight: 500; color: var(--text);
    background: rgba(255,255,255,0.8); border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; outline: none; font-family: inherit;
  }
  .add-row input:focus { border-color: rgba(0,0,0,0.35); }
  .add-btn {
    padding: 0 18px; border: none; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: inherit;
  }
  .add-btn:hover { opacity: 0.85; }
  .reset-btn {
    margin-top: 14px; width: 100%; padding: 12px; border: none; border-radius: 12px;
    background: rgba(52,199,89,0.12); color: var(--success); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  .reset-btn:hover { background: rgba(52,199,89,0.22); }
  .empty-hint { font-size: 14px; color: var(--muted); text-align: center; padding: 18px 0; }

  /* Final TS */
  .final { margin-top: 18px; }
  .result {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 20px; background: var(--accent); color: #fff;
    border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  }
  .result .label .name { font-size: 14px; font-weight: 700; letter-spacing: 1px; opacity: 0.8; }
  .result .value { font-size: 26px; font-weight: 700; }
  .result .value.empty { opacity: 0.5; }

  /* Notes list */
  .note-item {
    background: var(--panel-bg); border: 1px solid var(--panel-border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; width: 100%; max-width: 100%; overflow: hidden;
    cursor: pointer; transition: background 0.15s;
  }
  .note-item:hover { background: rgba(255,255,255,0.9); }
  .note-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .note-snippet { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-meta { font-size: 11px; color: #b0b0b5; margin-top: 6px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100;
  }
  .modal {
    width: 100%; max-width: 440px; max-height: 85vh; display: flex; flex-direction: column;
    background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    overflow: hidden; animation: pop 0.18s ease;
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .modal-title { font-size: 17px; font-weight: 700; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .note-preview { font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .note-preview:empty::after { content: "This note is empty."; color: var(--muted); font-style: italic; }
  .editor-area { width: 100%; min-height: 220px; padding: 12px 14px; font-size: 16px; line-height: 1.5;
    font-family: inherit; color: var(--text); background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px; outline: none; resize: vertical; }
  .editor-title { width: 100%; padding: 10px 14px; font-size: 16px; font-weight: 600; margin-bottom: 10px;
    background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; outline: none; font-family: inherit; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid rgba(0,0,0,0.06); }
  .btn {
    padding: 10px 16px; border: none; border-radius: 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: rgba(0,0,0,0.06); color: var(--text); }
  .btn.danger { background: rgba(255,59,48,0.1); color: var(--danger); }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
    background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 200;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 480px) {
    html, body { padding: 0; align-items: stretch; }
    .card { max-width: 100%; width: 100%; height: 100%; max-height: none; border-radius: 0; border: none; box-shadow: none; padding: 16px 14px; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    h1 { font-size: 22px; }
    .tab { font-size: 12px; padding: 8px 0; }
  }

  @media (prefers-color-scheme: dark) {
    :root { --glass: rgba(28, 28, 30, 0.6); --glass-border: rgba(255, 255, 255, 0.1); --text: #f5f5f7; --muted: #98989d; --accent: #ffffff; --panel-bg: rgba(255, 255, 255, 0.06); --panel-border: rgba(255,255,255,0.08); }
    body { background: linear-gradient(160deg, #1c1c1e 0%, #000000 100%); }
    .tabs { background: rgba(255,255,255,0.06); }
    .tab.active { background: rgba(255,255,255,0.15); color: var(--text); box-shadow: none; }
    .add-row input, .habit-value, .editor-area, .editor-title { background: rgba(255,255,255,0.08); color: var(--text); border-color: rgba(255,255,255,0.12); }
    .note-item:hover { background: rgba(255,255,255,0.1); }
    .modal { background: #1c1c1e; }
    .btn.ghost { background: rgba(255,255,255,0.08); color: var(--text); }
    .btn.primary { background: #fff; color: #000; }
    .add-btn { background: #fff; color: #000; }
    .result { background: #fff; color: #000; }
    .result .value.empty { color: rgba(0,0,0,0.35); }
    .toast { background: #fff; color: #000; }
  }

  /* App-shell layout: page never scrolls, lists scroll internally */
  #habits-list, #notes-list {
    flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  #habits-list { max-height: calc(4 * 56px + 3 * 10px); }
  #notes-list { width: 100%; max-width: 100%; }
  .add-row, .reset-btn, .final, .section-title { flex-shrink: 0; }
  @media (max-width: 480px) {
    .modal-overlay { padding: 10px; }
    .modal { max-height: calc(100dvh - 20px); }
  }

  /* Compact mobile: fits viewport, symmetric margins, no iOS input auto-zoom */
  @media (max-width: 480px) {
    .card {
      padding: 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      max-width: 100%; min-width: 0; overflow-x: clip;
    }
    .card > *, .panel > * { min-width: 0; }
    h1 { font-size: 20px; margin-bottom: 2px; }
    .subtitle { font-size: 12px; margin-bottom: 10px; }
    .tabs { margin-bottom: 10px; }
    .tab { padding: 8px 0; font-size: 13px; }
    .section-title { margin-bottom: 8px; }
    .add-row { margin-top: 10px; gap: 6px; }
    .add-row input { padding: 10px 12px; font-size: 16px; }
    .add-btn { padding: 0 14px; font-size: 14px; }
    .reset-btn { margin-top: 8px; padding: 10px; font-size: 14px; }
    .final { margin-top: 10px; }
    .result { padding: 12px 16px; }
    .result .value { font-size: 22px; }
    .icon-btn { width: 30px; height: 30px; flex: 0 0 30px; font-size: 12px; }
    .note-item { padding: 10px 12px; margin-bottom: 8px; }
    .note-title { font-size: 15px; }
    .editor-title, .editor-area { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="card">
  <h1>Habit Tracker</h1>
  <div class="subtitle">Daily habits &amp; notes</div>

  <div class="tabs">
    <div class="tab active" data-tab="tracker">Tracker</div>
    <div class="tab" data-tab="notes">Notes</div>
  </div>

  <div class="panel active" id="panel-tracker">
    <div class="section-title">Today's habits</div>
    <div id="habits-list"></div>
    <div class="add-row">
      <input type="text" id="new-habit-name" placeholder="New habit name" maxlength="60">
      <button class="add-btn" id="add-habit-btn">Add</button>
    </div>
    <button class="reset-btn" id="reset-btn">Finished</button>
    <div class="final">
      <div class="result">
        <div class="label"><span class="name">TOTAL</span></div>
        <span class="value empty" id="ts">&mdash;</span>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-notes">
    <div class="section-title">Your notes</div>
    <div id="notes-list"></div>
    <div class="add-row">
      <input type="text" id="new-note-title" placeholder="New note title" maxlength="120">
      <button class="add-btn" id="add-note-btn">Add</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="note-modal" style="display:none;">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="icon-btn" id="modal-close" title="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="note-preview" id="modal-preview"></div>
      <div id="modal-editor" style="display:none;">
        <input class="editor-title" id="edit-title" maxlength="120" placeholder="Title">
        <textarea class="editor-area" id="edit-content" placeholder="Write your note..."></textarea>
      </div>
    </div>
    <div class="modal-footer" id="modal-footer">
      <button class="btn ghost" id="btn-edit">Edit</button>
      <button class="btn danger" id="btn-delete-note">Delete</button>
      <button class="btn primary" id="btn-save" style="display:none;">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  // Tabs
  var tabs = document.querySelectorAll('.tab');
  var panels = document.querySelectorAll('.panel');
  tabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      tabs.forEach(function(t) { t.classList.remove('active'); });
      panels.forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function fmt(n) {
    if (!isFinite(n)) return '\u2014';
    return Math.round((n + Number.EPSILON) * 100) / 100;
  }

  // Habits
  var habits = [];

  async function loadHabits() {
    try {
      var res = await fetch('/api/habits');
      var data = await res.json();
      habits = data.habits || [];
      renderHabits();
    } catch(e) { toast('Error: ' + e.message); }
  }

  function renderHabits() {
    var list = document.getElementById('habits-list');
    if (!habits.length) {
      list.innerHTML = '<div class="empty-hint">No habits yet. Add one below.</div>';
      updateTotal();
      return;
    }
    list.innerHTML = habits.map(function(h) {
      return '<div class="habit-item">' +
        '<div class="habit-name" id="habit-name-' + h.id + '">' + escapeHtml(h.name) + '</div>' +
        '<input type="number" step="any" class="habit-value" value="' + (h.value === null ? '' : h.value) + '" ' +
          'placeholder="0" onchange="setValue(' + h.id + ', this.value)">' +
        '<button class="icon-btn" title="Rename" onclick="startRename(' + h.id + ')">&#9998;</button>' +
        '<button class="icon-btn danger" title="Delete" onclick="deleteHabit(' + h.id + ')">&#128465;</button>' +
      '</div>';
    }).join('');
    updateTotal();
  }

  function updateTotal() {
    var ts = document.getElementById('ts');
    var sum = 0, any = false;
    habits.forEach(function(h) {
      if (h.value !== null && isFinite(h.value)) { sum += h.value; any = true; }
    });
    if (any) { ts.textContent = fmt(sum); ts.classList.remove('empty'); }
    else { ts.textContent = '\u2014'; ts.classList.add('empty'); }
  }

  window.setValue = async function(id, val) {
    var habit = habits.find(function(h) { return h.id === id; });
    if (!habit) return;
    habit.value = val === '' ? null : parseFloat(val);
    updateTotal();
    try {
      await fetch('/api/habits/' + id + '/value', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: habit.value })
      });
    } catch(e) { console.error(e); }
  };

  window.startRename = function(id) {
    var habit = habits.find(function(h) { return h.id === id; });
    if (!habit) return;
    var nameEl = document.getElementById('habit-name-' + id);
    if (!nameEl) return;
    nameEl.innerHTML = '<input type="text" value="' + escapeHtml(habit.name) + '" maxlength="60" id="rename-input-' + id + '">';
    var input = document.getElementById('rename-input-' + id);
    input.focus(); input.select();
    var done = async function() {
      var newName = input.value.trim();
      if (!newName || newName === habit.name) { renderHabits(); return; }
      habit.name = newName;
      try {
        await fetch('/api/habits/' + id, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: newName })
        });
        toast('Renamed');
      } catch(e) { toast('Error: ' + e.message); }
      renderHabits();
    };
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { renderHabits(); }
    });
    input.addEventListener('blur', done);
  };

  window.deleteHabit = async function(id) {
    var habit = habits.find(function(h) { return h.id === id; });
    if (!habit) return;
    if (!confirm('Delete habit "' + habit.name + '"?')) return;
    try {
      var res = await fetch('/api/habits/' + id, { method: 'DELETE' });
      var data = await res.json();
      if (data.success) { habits = habits.filter(function(h) { return h.id !== id; }); renderHabits(); toast('Deleted'); }
      else toast('Delete failed');
    } catch(e) { toast('Error: ' + e.message); }
  };

  document.getElementById('add-habit-btn').addEventListener('click', async function() {
    var input = document.getElementById('new-habit-name');
    var name = input.value.trim();
    if (!name) { toast('Enter a habit name'); return; }
    try {
      var res = await fetch('/api/habits', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name })
      });
      var data = await res.json();
      if (data.success) { input.value = ''; habits.push(data.habit); renderHabits(); toast('Habit added'); }
      else toast('Add failed');
    } catch(e) { toast('Error: ' + e.message); }
  });
  document.getElementById('new-habit-name').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('add-habit-btn').click();
  });

  document.getElementById('reset-btn').addEventListener('click', async function() {
    if (!confirm('Reset all habit values for today?')) return;
    try {
      var res = await fetch('/api/habits/reset', { method: 'POST' });
      var data = await res.json();
      if (data.success) { habits.forEach(function(h) { h.value = null; }); renderHabits(); toast('Values reset'); }
      else toast('Reset failed');
    } catch(e) { toast('Error: ' + e.message); }
  });

  // Notes
  var notes = [];
  var currentNote = null;

  async function loadNotes() {
    try {
      var res = await fetch('/api/notes');
      var data = await res.json();
      notes = data.notes || [];
      renderNotes();
    } catch(e) { toast('Error: ' + e.message); }
  }

  function renderNotes() {
    var list = document.getElementById('notes-list');
    if (!notes.length) {
      list.innerHTML = '<div class="empty-hint">No notes yet. Add one below.</div>';
      return;
    }
    list.innerHTML = notes.map(function(n) {
      var snippet = (n.content || '').replace(/\s+/g, ' ').trim();
      return '<div class="note-item" onclick="openNote(' + n.id + ')">' +
        '<div class="note-title">' + escapeHtml(n.title) + '</div>' +
        (snippet ? '<div class="note-snippet">' + escapeHtml(snippet) + '</div>' : '') +
        '<div class="note-meta">' + escapeHtml(n.updated_at || '') + '</div>' +
      '</div>';
    }).join('');
  }

  window.openNote = function(id) {
    currentNote = notes.find(function(n) { return n.id === id; });
    if (!currentNote) return;
    document.getElementById('modal-title').textContent = currentNote.title;
    document.getElementById('modal-preview').innerHTML = escapeHtml(currentNote.content || '');
    document.getElementById('modal-preview').style.display = 'block';
    document.getElementById('modal-editor').style.display = 'none';
    document.getElementById('btn-edit').style.display = 'inline-block';
    document.getElementById('btn-save').style.display = 'none';
    document.getElementById('btn-delete-note').style.display = 'inline-block';
    document.getElementById('note-modal').style.display = 'flex';
  };

  document.getElementById('btn-edit').addEventListener('click', function() {
    if (!currentNote) return;
    document.getElementById('modal-preview').style.display = 'none';
    document.getElementById('modal-editor').style.display = 'block';
    document.getElementById('edit-title').value = currentNote.title;
    document.getElementById('edit-content').value = currentNote.content || '';
    document.getElementById('btn-edit').style.display = 'none';
    document.getElementById('btn-save').style.display = 'inline-block';
    document.getElementById('edit-content').focus();
  });

  document.getElementById('btn-save').addEventListener('click', async function() {
    if (!currentNote) return;
    var title = document.getElementById('edit-title').value.trim();
    var content = document.getElementById('edit-content').value;
    if (!title) { toast('Title is required'); return; }
    try {
      var res = await fetch('/api/notes/' + currentNote.id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, content: content })
      });
      var data = await res.json();
      if (data.success) {
        currentNote.title = title; currentNote.content = content;
        toast('Note saved'); closeNote(); renderNotes();
      } else toast('Save failed');
    } catch(e) { toast('Error: ' + e.message); }
  });

  document.getElementById('btn-delete-note').addEventListener('click', async function() {
    if (!currentNote) return;
    if (!confirm('Delete note "' + currentNote.title + '"?')) return;
    try {
      var res = await fetch('/api/notes/' + currentNote.id, { method: 'DELETE' });
      var data = await res.json();
      if (data.success) { toast('Deleted'); closeNote(); await loadNotes(); }
      else toast('Delete failed');
    } catch(e) { toast('Error: ' + e.message); }
  });

  function closeNote() {
    document.getElementById('note-modal').style.display = 'none';
    currentNote = null;
  }
  document.getElementById('modal-close').addEventListener('click', closeNote);
  document.getElementById('note-modal').addEventListener('click', function(e) {
    if (e.target === this) closeNote();
  });

  document.getElementById('add-note-btn').addEventListener('click', async function() {
    var input = document.getElementById('new-note-title');
    var title = input.value.trim() || 'New Note';
    try {
      var res = await fetch('/api/notes', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: title, content: '' })
      });
      var data = await res.json();
      if (data.success) { input.value = ''; await loadNotes(); toast('Note created'); openNote(data.note.id); document.getElementById('btn-edit').click(); }
    } catch(e) { toast('Error: ' + e.message); }
  });
  document.getElementById('new-note-title').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('add-note-btn').click();
  });

  // Init
  loadHabits();
  loadNotes();
</script>
</body>
</html>
