<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Energy Calculator</title>
<style>
  :root {
    --bg: #f5f5f7;
    --glass: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(255, 255, 255, 0.8);
    --text: #1a1a1a;
    --muted: #8a8a8e;
    --accent: #000000;
    --radius: 22px;
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    --tab-active: rgba(0, 0, 0, 0.06);
    --tab-inactive: transparent;
    --panel-bg: rgba(255, 255, 255, 0.75);
    --panel-border: rgba(0, 0, 0, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

  html, body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #ffffff 0%, #e8e8ec 100%);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--glass);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
  }

  h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 22px;
    font-weight: 500;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: rgba(0, 0, 0, 0.04);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 22px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    user-select: none;
  }

  .tab.active {
    background: #fff;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
  }

  /* Panels */
  .panel { display: none; }
  .panel.active { display: block; }

  .group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 22px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(0, 0, 0, 0.06);
    border-radius: 14px;
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  input::placeholder { color: #c2c2c7; font-weight: 400; }
  input:focus {
    border-color: rgba(0, 0, 0, 0.4);
    background: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.05);
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .fixed {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    padding: 10px;
    background: rgba(0, 0, 0, 0.03);
    border-radius: 12px;
    margin-bottom: 22px;
  }
  .fixed b { color: var(--text); }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
  }

  .result .label {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .result .name { font-size: 15px; font-weight: 600; }
  .result .formula { font-size: 11px; color: var(--muted); font-family: "SF Mono", ui-monospace, monospace; }

  .result .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
  }

  .value.empty { color: #c2c2c7; font-weight: 500; }

  /* Final TS - always visible, highlighted */
  .final {
    margin-top: 22px;
  }

  .final .result {
    background: var(--text);
    border-color: var(--text);
  }
  .final .result .name { color: #fff; }
  .final .result .formula { color: rgba(255,255,255,0.5); }
  .final .result .value { color: #fff; }
  .final .result .value.empty { color: rgba(255,255,255,0.3); }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --glass: rgba(28, 28, 30, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text: #f5f5f7;
      --muted: #98989d;
      --accent: #ffffff;
      --tab-active: rgba(255,255,255,0.12);
      --panel-bg: rgba(255, 255, 255, 0.06);
      --panel-border: rgba(255,255,255,0.08);
    }
    body { background: linear-gradient(160deg, #1c1c1e 0%, #000000 100%); }
    .tabs { background: rgba(255,255,255,0.06); }
    .tab.active { background: rgba(255,255,255,0.15); color: var(--text); box-shadow: none; }
    input { background: rgba(255, 255, 255, 0.08); color: var(--text); border-color: rgba(255,255,255,0.1); }
    input::placeholder { color: #6a6a70; }
    input:focus { background: rgba(255, 255, 255, 0.12); border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0 4px rgba(255,255,255,0.06); }
    .fixed { background: rgba(255,255,255,0.06); }
    .final .result { background: #fff; border-color: #fff; }
    .final .result .name { color: #000; }
    .final .result .formula { color: rgba(0,0,0,0.5); }
    .final .result .value { color: #000; }
    .final .result .value.empty { color: rgba(0,0,0,0.3); }
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Energy</h1>
    <div class="subtitle">Calculate your energy metrics</div>

    <div class="tabs">
      <div class="tab active" data-tab="energy">Energy</div>
      <div class="tab" data-tab="other">Other</div>
    </div>

    <!-- Energy Panel -->
    <div class="panel active" id="panel-energy">
      <div class="group">
        <div class="field">
          <label for="fh">FH (hours)</label>
          <input type="number" id="fh" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="ac">AC</label>
          <input type="number" id="ac" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="ic">IC</label>
          <input type="number" id="ic" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="b">B</label>
          <input type="number" id="b" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="cw">CW</label>
          <input type="number" id="cw" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="hw">HW</label>
          <input type="number" id="hw" placeholder="0" step="any" inputmode="decimal">
        </div>
      </div>

      <div class="fixed">Fixed value &middot; <b>BMR = 1870</b></div>

      <div class="section-title">Results</div>
      <div class="results">
        <div class="result">
          <div class="label">
            <span class="name">FS</span>
            <span class="formula">((FH/24)·BMR) + AC + IC</span>
          </div>
          <span class="value empty" id="fs">—</span>
        </div>
        <div class="result">
          <div class="label">
            <span class="name">FWC</span>
            <span class="formula">(BMR+AC+IC) − (24−FH)·2000</span>
          </div>
          <span class="value empty" id="fwc">—</span>
        </div>
        <div class="result">
          <div class="label">
            <span class="name">FS / BMR Ratio</span>
            <span class="formula">FS / BMR</span>
          </div>
          <span class="value empty" id="ratio">—</span>
        </div>
        <div class="result">
          <div class="label">
            <span class="name">TES</span>
            <span class="formula">(FS + FWC)/100 + (B + CW + HW)</span>
          </div>
          <span class="value empty" id="tes">—</span>
        </div>
      </div>
    </div>

    <!-- Other Panel -->
    <div class="panel" id="panel-other">
      <div class="group">
        <div class="field">
          <label for="nm">NM</label>
          <input type="number" id="nm" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="trio">Trio (hours)</label>
          <input type="number" id="trio" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="fmf">FMF</label>
          <input type="number" id="fmf" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="sr">SR</label>
          <input type="number" id="sr" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="p">P</label>
          <input type="number" id="p" placeholder="0" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="sm">SM</label>
          <input type="number" id="sm" placeholder="0" step="any" inputmode="decimal">
        </div>
      </div>
    </div>

    <!-- Final TS - always visible -->
    <div class="final">
      <div class="result">
        <div class="label">
          <span class="name">TS</span>
          <span class="formula">TES + NM + Trio + FMF + SR + P + SM</span>
        </div>
        <span class="value empty" id="ts">—</span>
      </div>
    </div>
  </div>

<script>
  const BMR = 1870;

  // Tab switching
  const tabs = document.querySelectorAll('.tab');
  const panels = document.querySelectorAll('.panel');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      panels.forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  const inputs = {
    fh: document.getElementById('fh'),
    ac: document.getElementById('ac'),
    ic: document.getElementById('ic'),
    b: document.getElementById('b'),
    cw: document.getElementById('cw'),
    hw: document.getElementById('hw'),
    nm: document.getElementById('nm'),
    trio: document.getElementById('trio'),
    fmf: document.getElementById('fmf'),
    sr: document.getElementById('sr'),
    p: document.getElementById('p'),
    sm: document.getElementById('sm')
  };
  const outputs = {
    fs: document.getElementById('fs'),
    fwc: document.getElementById('fwc'),
    ratio: document.getElementById('ratio'),
    tes: document.getElementById('tes'),
    ts: document.getElementById('ts')
  };

  function num(v) {
    if (v === '' || v === null || v === undefined) return NaN;
    return parseFloat(v);
  }

  function fmt(n) {
    if (!isFinite(n)) return '—';
    const r = Math.round((n + Number.EPSILON) * 100) / 100;
    return r.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function setEmpty(el) {
    el.textContent = '—';
    el.classList.add('empty');
  }
  function setValue(el, val) {
    el.textContent = fmt(val);
    el.classList.remove('empty');
  }

  function calc() {
    const fh = num(inputs.fh.value);
    const ac = num(inputs.ac.value);
    const ic = num(inputs.ic.value);
    const b = num(inputs.b.value);
    const cw = num(inputs.cw.value);
    const hw = num(inputs.hw.value);
    const nm = num(inputs.nm.value);
    const trio = num(inputs.trio.value);
    const fmf = num(inputs.fmf.value);
    const sr = num(inputs.sr.value);
    const p = num(inputs.p.value);
    const sm = num(inputs.sm.value);

    const allValid = [fh, ac, ic, b, cw, hw, nm, trio, fmf, sr, p, sm].every(v => isFinite(v));

    if (!allValid) {
      setEmpty(outputs.fs);
      setEmpty(outputs.fwc);
      setEmpty(outputs.ratio);
      setEmpty(outputs.tes);
      setEmpty(outputs.ts);
      return;
    }

    const fs = ((fh / 24) * BMR) + ac + ic;
    const fwc = (BMR + ac + ic) - ((24 - fh) * 2000);
    const ratio = fs / BMR;
    const tes = (fs + fwc) / 100 + (b + cw + hw);
    const ts = tes + nm + trio + fmf + sr + p + sm;

    setValue(outputs.fs, fs);
    setValue(outputs.fwc, fwc);
    setValue(outputs.ratio, ratio);
    setValue(outputs.tes, tes);
    setValue(outputs.ts, ts);
  }

  Object.values(inputs).forEach(el => {
    el.addEventListener('input', calc);
  });

  calc();
</script>
</body>
</html>
